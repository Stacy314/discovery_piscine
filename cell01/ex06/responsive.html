<!DOCTYPE html>
<html>
<head>
    <title>Color Table</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }
        table {
            width: 100%;
            height: 100%;
            table-layout: fixed;
            border-collapse: collapse;
        }
        td {
            text-align: center;
            font-size: 2em;
            color: white;
        }
        .box1 {
            background-color: #007BFF;
        }
        .box2 {
            background-color: #28a745;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td class="box1">This is the first box!</td>
            <td class="box2">And this is the second box!</td>
        </tr>
    </table>
</body>
</html>
